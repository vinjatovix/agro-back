name: Build

on: [push, pull_request]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: |
          npm ci

      - name: Run Shai-Hulud Integrity Scanner (Warn Only)
        run: |
          curl -fsSL --retry 3 --retry-delay 2 https://raw.githubusercontent.com/vinjatovix/shai-hulud-integrity-scanner/refs/heads/main/scan-project.sh > /tmp/scan-project.sh
          chmod +x /tmp/scan-project.sh
          /tmp/scan-project.sh . --warn-only --exclude-dir=".specify" | tee scan_report.txt

      - name: Comment PR on Medium Risk
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if grep -q "MEDIUM RISK" scan_report.txt; then
            REPORT_CONTENT=$(cat scan_report.txt)
            cat << EOF > comment.md
          ### ⚠️ Shai-Hulud Scanner - Warnings Detected
          The pipeline completed successfully, but manual review is required for the following security findings:

          \`\`\`text
          $REPORT_CONTENT
          \`\`\`
          EOF
            gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PORT: 3377
      HOST: http://localhost
      ALLOWED_ORIGINS: http://localhost:3377
      JSON_BODY_LIMIT: 1mb
      URL_ENCODED_BODY_LIMIT: 1mb
      REQUEST_TIMEOUT_MS: 30000
      HEADERS_TIMEOUT_MS: 35000
      KEEP_ALIVE_TIMEOUT_MS: 5000
      NODE_ENV: test
      MONGO_CONNECTION: mongodb
      MONGO_URL: localhost:27017
      MONGO_DB: test
      MONGO_USERNAME: localUser
      MONGO_PASSWORD: localPassword
      MONGO_APP_NAME: 'Cluster0'
      JWT_SECRET: secret
      JWT_DEFAULT_DURATION: 2h
      BCRYPT_SALT_ROUNDS: 12
      MONGO_REPLICA_SET: rs0
      GOOGLE_CLIENT_ID: your-google-client-id.apps.googleusercontent.com

    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          npm ci

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Run linting
        run: |
          npm run lint

      - name: Build
        run: |
          npm run build

      - name: Run mongo docker
        run: |
          npm run docker:mongo

      - name: Run tests and generate coverage
        run: |
          npm run test
