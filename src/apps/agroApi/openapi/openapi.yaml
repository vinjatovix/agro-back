openapi: 3.0.3

info:
  title: MiBancal API
  version: 1.0.1
  description: API for managing plants and user authentication in the MiBancal application.
  termsOfService: http://example.com/terms/
  contact:
    name: MiBancal Support
    email: hola@mibancal.app
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

tags:
  - name: Health
    description: Endpoint for health checks.
  - name: Auth
    description: Endpoints for user authentication and management.
  - name: Families
    description: Endpoints for managing plant families.
  - name: Plants
    description: Endpoints for managing plant data.
  - name: Beds
    description: Endpoints for managing garden beds.
  - name: PlantInstances
    description: Endpoints for managing crop instances in beds.
  - name: Users
    description: Administrator endpoints for managing accounts and their roles.

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a local account
      description: >
        Every well-formed registration gets the same `202` with an empty body,
        whether or not the email already has an account. If the registration can
        proceed, an activation email is on its way (Spanish only). The owner of an
        existing account gets a "registration attempt" notice instead. The id and
        the username are checked before the email: a taken id or username is a
        `409` that does not depend on the email. Every attempt counts towards the
        rate limit (5 per IP every 15 minutes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '202':
          description: >
            Accepted. No body. Activate the account from the emailed link, then
            call `/auth/login`.
        # Request shape or password rules only; never says that the email
        # already has an account.
        '400':
          $ref: '#/components/responses/ValidationError'
        # "User with id <id> already exists" or "Username already in use".
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/activate:
    post:
      tags: [Auth]
      summary: Activate an account with the emailed token
      description: >
        Called by the frontend page the activation email links to; the page reads
        the token from the link's fragment (`#token=…`) and posts it here. The
        token is single-use and expires 24 hours after it was issued. Success only
        confirms the email; it returns no session token. Failed attempts count
        towards the authentication rate limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateAccountRequest'
      responses:
        '204':
          description: Email validated. Log in with `/auth/login`.
        # A schema error (`errors.token`, `errors.<unknown field>`), or the
        # uniform `{ "message": "Invalid or expired token" }` for any token that
        # cannot activate an account (unknown, expired, used, replaced,
        # malformed or of another purpose).
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request password reset email
      description: >
        Requests a password reset link for the given email address.
        Answers with 202 Accepted and an empty body whether or not an account exists,
        preventing account enumeration. When an account exists, a single-use 30-minute
        token is generated and sent in the background. If a reset token was already issued
        within the last 2 minutes, no new email or token is generated.
        Every request counts toward the password reset rate limit (5 requests per 15 minutes per IP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Accepted. If the email belongs to an account, a reset email is on its way.
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset account password with one-time token
      description: >
        Resets the password of the account matching the provided one-time reset token.
        Validates password rules and confirmation match before checking the token.
        On success, sets or creates the local password, marks the email as validated,
        removes the reset token, discards any pending activation token, and notifies the owner.
        Does not issue a session token; user must log in explicitly with the new password.
        Failed attempts count towards the authentication rate limit (5 failed attempts per 15 minutes per IP).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset completed successfully. No body.
        '400':
          # Validation error (password rules, missing fields) OR uniform
          # { "message": "Invalid or expired token" } for unknown, expired, used,
          # replaced, or mismatched tokens.
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login user
      description: >
        An account whose email is not validated is refused with the same `401`
        as wrong credentials (except when the API runs in `development`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserRequest'
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/google:
    post:
      tags: [Auth]
      summary: Authenticate with Google
      description: >
        Takes the Google ID token (`idToken`) that the client obtained with
        Google Sign-In for this application's web client id. The API checks
        it with Google's public keys (signature, issuer, audience, expiry),
        requires an email that Google marks as verified, and stores no state
        between requests: no authorization code, session or nonce.

        The account is matched by Google identity first, then by email. A
        first sign-in creates an account with a validated email, no password,
        the `user` role and a username derived from the email (made unique
        with a short suffix when it is taken). Signing in with Google for the
        email of an existing account links Google to it: if that account's
        email was not validated, its local password is removed and the email
        becomes validated; if it was validated, the password stays and the
        owner is emailed that Google was linked. Two simultaneous first
        sign-ins of the same person both succeed on the same account.

        Always answers the usual `{ token }`, identical to a password login.
        Every untrusted token gets the same `401`. Failed attempts count
        toward the authentication rate limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateWithGoogleRequest'
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: >-
            The token is malformed, forged, expired, issued by someone other
            than Google or for another application, its email is not verified,
            or the email belongs to an account linked to another Google
            identity. Always `{ "message": "Invalid Google token" }`.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Invalid Google token
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/auth/github:
    post:
      tags: [Auth]
      summary: Authenticate with GitHub
      description: >
        Takes a GitHub authorization `code` and the PKCE `codeVerifier` the
        client generated. The API exchanges the code with GitHub server-side
        using the application's client secret (which the client never sees) and
        the verifier, reads the person's stable numeric GitHub user id and the
        list of emails, and requires one that is both primary and verified. The
        short-lived GitHub access token is used only to read the identity and is
        never stored or returned. The API stores no state between requests: no
        authorization code, verifier or access token.

        The account is matched by GitHub identity first (the numeric user id,
        never the login name), then by email, through the same resolution step
        Google uses. A first sign-in creates an account with a validated email,
        no password, the `user` role and a username derived from the email
        (made unique with a short suffix when it is taken). Signing in with
        GitHub for the email of an existing account links GitHub to it: if that
        account's email was not validated, its local password is removed and the
        email becomes validated; if it was validated, the existing sign-in
        methods keep working and the owner is emailed that GitHub was linked.
        Two simultaneous first sign-ins of the same person both succeed on the
        same account.

        Always answers the usual `{ token }`, identical to a password or Google
        login. Every untrusted sign-in gets the same `401`. Failed attempts
        count toward the authentication rate limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateWithGithubRequest'
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: >-
            GitHub rejected the authorization code or the PKCE verifier (invalid,
            expired, already used, or issued for another application), or the
            resolved GitHub account has no email that is both primary and
            verified, or the email belongs to an account linked to another
            GitHub identity. Always `{ "message": "Invalid GitHub authorization" }`.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Invalid GitHub authorization
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token
      description: >
        Refused with the same `401` as an invalid token when the account no
        longer exists or its email is not validated (except in `development`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/update:
    post:
      tags: [Auth]
      summary: Update password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/families:
    get:
      tags: [Families]
      summary: Get all families

      parameters:
        - in: query
          name: filter
          description: >
            Declared fields only, one operator per field. Unknown fields,
            operators or values of the wrong type → 400.
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/FamilyListFilter'
        - in: query
          name: sort
          description: Declared sort keys only, `asc` or `desc`.
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/FamilyListSort'
        - in: query
          name: pagination
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/ListPagination'
        - $ref: '#/components/parameters/FamilyFields'

      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      anyOf:
                        - $ref: '#/components/schemas/Family'
                        - $ref: '#/components/schemas/FamilyFieldset'
                  pagination:
                    $ref: '#/components/schemas/PaginationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Families]
      summary: Create family
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFamily'

      responses:
        '201':
          description: Family created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'

        '400':
          $ref: '#/components/responses/ValidationError'

        '401':
          $ref: '#/components/responses/UnauthorizedError'

        '403':
          $ref: '#/components/responses/ForbiddenError'

        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/families/{idOrSlug}:
    get:
      tags: [Families]
      summary: Get family by id or slug
      parameters:
        - $ref: '#/components/parameters/FamilyIdOrSlug'
        - $ref: '#/components/parameters/FamilyFields'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ReadETag'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Family'
                  - $ref: '#/components/schemas/FamilyFieldset'
        '304':
          # Only for a read without `fields`.
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Families]
      summary: Update family
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FamilyIdOrSlug'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFamily'
      responses:
        '200':
          description: Updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Family'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/plants:
    get:
      tags: [Plants]
      summary: Get all plants
      description: >
        Public. The token is optional: anonymous callers and plain users get
        only ACTIVE plants; with an `admin` token the list also includes
        DELETED ones (tell them apart by `status` and `deletedAt`). There is
        no filter by status. A malformed or expired token → 401.
      security:
        - {}
        - bearerAuth: []

      parameters:
        - in: query
          name: filter
          description: >
            Declared fields only, one operator per field. Unknown fields,
            operators or values of the wrong type → 400.
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/PlantListFilter'
        - in: query
          name: sort
          description: Declared sort keys only, `asc` or `desc`.
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/PlantListSort'
        - in: query
          name: pagination
          style: deepObject
          explode: true
          schema:
            $ref: '#/components/schemas/ListPagination'
        - $ref: '#/components/parameters/PlantFields'
        - $ref: '#/components/parameters/PlantInclude'

      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      anyOf:
                        - $ref: '#/components/schemas/Plant'
                        - $ref: '#/components/schemas/PlantFieldset'
                  pagination:
                    $ref: '#/components/schemas/PaginationResponse'

        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Plants]
      summary: Create plant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlant'
      responses:
        '201':
          description: Plant created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/plants/{id}:
    get:
      tags: [Plants]
      summary: Get plant by id
      description: >
        Public. The token is optional: a DELETED plant answers 404 unless the
        caller has an `admin` token. A malformed or expired token → 401.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/PlantFields'
        - $ref: '#/components/parameters/PlantInclude'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              $ref: '#/components/headers/ReadETag'
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/Plant'
                  - $ref: '#/components/schemas/PlantFieldset'
        '304':
          # Only for a read without `fields` or `include`.
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Plants]
      summary: Update plant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlant'
      responses:
        '200':
          description: Updated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Plants]
      summary: Delete plant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/beds:
    get:
      tags: [Beds]
      summary: Get user beds
      description: >
        List of beds. Unknown query parameters are rejected (400).
        With `include=plantInstances`, full crops are embedded; otherwise a UUID array.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BedInclude'
      responses:
        '200':
          description: List of beds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bed'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Beds]
      summary: Create bed
      description: >
        No query parameters are accepted. Unknown body fields (`userId`,
        `plantInstances`…) → 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBed'
      responses:
        '201':
          description: Bed created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bed'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/beds/{id}:
    get:
      tags: [Beds]
      summary: Get bed by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BedId'
        - $ref: '#/components/parameters/BedInclude'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Bed
          headers:
            ETag:
              $ref: '#/components/headers/ReadETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bed'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Beds]
      summary: Update bed
      description: Check order — authentication, If-Match, then request validation.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BedId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBed'
      responses:
        '200':
          description: Updated bed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bed'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Beds]
      summary: Delete bed
      description: >
        Check order — authentication, If-Match, then request validation. No
        query, no body.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BedId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/plant-instances:
    post:
      tags: [PlantInstances]
      summary: Place a crop in a bed
      description: >
        Places a crop of an existing catalog plant at coordinates inside an active bed
        owned by the authenticated user. Checks spatial rules (boundaries and neighbor spacing)
        and conditionally increments the bed's version before storing the crop.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacePlantInstance'
      responses:
        '201':
          description: Crop placed successfully.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantInstanceResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [PlantInstances]
      summary: List user crops
      description: >
        Returns a paginated list of active crops owned by the user. Supports filtering by bed
        (`filter[bedId][eq]`) and/or plant (`filter[plantId][eq]`), and sorting by `sort[plantedAt]`.
      security:
        - bearerAuth: []
      parameters:
        - name: filter[bedId][eq]
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: filter[plantId][eq]
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: sort[plantedAt]
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: pagination[page]
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pagination[limit]
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Paginated crops envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlantInstances'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/plant-instances/{id}:
    get:
      tags: [PlantInstances]
      summary: Get crop by id
      description: Returns one active crop owned by the user.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Crop details.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantInstanceResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [PlantInstances]
      summary: Update a crop
      description: >
        Partial update for crop growth status, variety, notes, or position.
        Moving the crop triggers a spatial boundary & neighbor spacing check and raises
        the bed version. Modifying only growth status, variety, or notes leaves the bed
        version unchanged. Requires `If-Match`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlantInstance'
      responses:
        '200':
          description: Crop updated successfully.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantInstanceResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [PlantInstances]
      summary: Remove a crop
      description: >
        Soft-deletes a crop by marking its status as removed. Raises the parent bed's version.
        Requires `If-Match`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Crop marked as removed.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/users/lookup:
    get:
      tags: [Users]
      summary: Admin exact lookup of an account by email OR username
      description: >
        Returns the account's stable id and minimal identifying fields. Exactly
        one of `email` or `username` MUST be provided (neither/both → 400).
        Exact match only; no substring or listing. Administrator only.
      security:
        - bearerAuth: []
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
        - name: username
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The single matching account.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLookupView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/users/{userId}/roles:
    patch:
      tags: [Users]
      summary: Admin grants and/or revokes roles on another account
      description: >
        Applies a role delta (`add` / `remove`) to the target account's current
        roles. Administrator only. Mandatory `If-Match`.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUserRolesRequest'
      responses:
        '200':
          description: Resulting roles and audit metadata.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRolesView'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '412':
          $ref: '#/components/responses/PreconditionFailedError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '428':
          $ref: '#/components/responses/PreconditionRequiredError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  headers:
    ETag:
      description: >
        Strong entity tag holding the resource's current `version` as a quoted
        decimal integer. Always equal to the `version` field of the body.
      required: true
      schema:
        type: string
        pattern: '^"(0|[1-9][0-9]*)"$'
        example: '"4"'

    ReadETag:
      description: >
        Version of the full resource, as in `ETag`. Sent only when the read
        uses neither `fields` nor `include`: a tailored body is not the
        representation the version names, so it carries no tag and
        `If-None-Match` is ignored.
      required: false
      schema:
        type: string
        pattern: '^"(0|[1-9][0-9]*)"$'
        example: '"4"'

  parameters:
    PlantFields:
      in: query
      name: fields
      description: >
        JSON:API sparse fieldset. `fields[plants]` is a comma-separated list
        of top-level fields: `id`, `identity`, `traits`, `phenology`,
        `knowledge`, `image`, `metadata`, `status`, `deletedAt`, `version`.
        `image` is the plant's primary picture, so a listing can show it
        without requesting `knowledge`. Entries are
        trimmed, blanks and repeats dropped, and the order does not matter;
        `id` is always sent. Any other resource type, an unknown or nested
        name (names are case-sensitive), or an empty list → 400. The response
        then holds `id` and the requested fields only, and carries no `ETag`.
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties: false
        properties:
          plants:
            type: string
            example: identity,traits

    FamilyFields:
      in: query
      name: fields
      description: >
        JSON:API sparse fieldset. `fields[families]` is a comma-separated list
        of top-level fields: `id`, `slug`, `name`, `aliases`, `scientificName`,
        `shortDescription`, `highlights`, `extra`, `metadata`, `version`. Same
        rules as for plants.
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties: false
        properties:
          families:
            type: string
            example: name,slug

    PlantInclude:
      in: query
      name: include
      description: >
        JSON:API include, comma-separated. `family` sends `identity.family`
        as a `FamilySummary`, reading every family of the page at once; a
        plant whose family is not found keeps the plain id. Skipped when
        `fields[plants]` leaves out `identity`. Any other relation or an empty
        list → 400. The response carries no `ETag`.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        items:
          type: string
          enum: [family]

    FamilyIdOrSlug:
      name: idOrSlug
      in: path
      required: true
      description: A UUID is looked up by id; anything else by slug. Trimmed.
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: '\S'

    BedId:
      name: id
      in: path
      required: true
      description: Bed identifier (UUID).
      schema:
        type: string
        format: uuid

    BedInclude:
      in: query
      name: include
      description: >
        JSON:API include, comma-separated. `plantInstances` embeds active crops in full
        instead of UUIDs. Any other relation or empty string answers 400.
        When present, the response carries no ETag and never answers 304.
      required: false
      schema:
        type: string
        enum: [plantInstances]

    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >
        One or more entity tags, comma-separated (RFC 9110 §13.1.1), as
        returned in `ETag`. The write proceeds when a strong tag equals the
        current version. Missing, empty or `*` → 428. Not an entity-tag list
        (e.g. `3`, `"3`, `"3" "4"`) or more than 50 tags → 400 with the error
        at `if-match`. Well-formed tags that cannot match (weak `W/"3"`, tags
        the API never emits such as `"abc"`, outdated versions) → 412, after
        the existence check (a missing resource still answers 404).
      schema:
        type: string
        # Documentation pattern: a list of [W/]"etagc*" with optional spaces.
        pattern: '^[ \t]*(,[ \t]*)*(W/)?"[^"\x00-\x20\x7F]*"([ \t]*,([ \t]*(W/)?"[^"\x00-\x20\x7F]*")?)*[ \t]*$'
        example: '"3"'
      examples:
        single:
          value: '"3"'
        list:
          value: '"2", "3"'

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >
        One or more entity tags, comma-separated (RFC 9110 §13.1.2), as
        returned in `ETag` on read. If the current version tag matches,
        returns 304 Not Modified.
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HS256 JWT returned as `{ token }` by `/auth/login`, `/auth/google`
        and `/auth/refresh`. Payload: `id` (UUID), `email`, `username`,
        `roles` (array of `admin` | `user`), plus the standard `iat` and
        `exp` claims. Lifetime comes from `JWT_DEFAULT_DURATION` (2h by
        default); read `exp` instead of assuming it. `/auth/refresh` only
        renews a token that has not expired yet.

  schemas:
    # Roles an account can HOLD and that responses expose.
    Role:
      type: string
      enum: [admin, user]

    # Roles the delta can grant/revoke: the manageable (elevated) roles only.
    # The base role `user` is permanent and NOT manageable, so it is excluded.
    # A later iteration adds `collaborator` here.
    ManageableRole:
      type: string
      enum: [admin]

    ChangeUserRolesRequest:
      type: object
      additionalProperties: false
      minProperties: 0
      description: >
        Role delta over the manageable (elevated) roles only. Omitting both
        `add` and `remove` (or sending `{}`) is a no-op. `add` and `remove`
        MUST be disjoint (else 422). The base role `user` is not a
        `ManageableRole`, so sending it in either array is a 400.
      properties:
        add:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ManageableRole'
        remove:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ManageableRole'

    UserRolesView:
      type: object
      description: Minimal role-change result; exposes no other account data.
      required: [id, roles, metadata]
      properties:
        id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        metadata:
          $ref: '#/components/schemas/Metadata'

    UserLookupView:
      type: object
      description: Minimal identifying fields returned by the admin lookup.
      required: [id, username, email, roles]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    Metadata:
      type: object
      required:
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
      properties:
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string

    PaginationResponse:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 1
        totalItems:
          type: integer
          example: 42
      required:
        - page
        - limit
        - totalPages
        - totalItems

    # ---------- shared operator shapes (one operator per field) ----------

    FilterText:
      description: Trimmed text, 1–200 characters. Blank → 400.
      type: string
      minLength: 1
      maxLength: 200
      pattern: '\S'

    FilterTextList:
      description: >
        Comma-separated values or a repeated key. Entries are trimmed and blank
        entries dropped; at least 1 and at most 200 entries remain.
      oneOf:
        - type: string
        - type: array
          maxItems: 200
          items:
            type: string

    TextFieldFilter:
      description: >
        Text field. Exactly one operator. `eq` with a comma → 400 (use `in`);
        `has`/`hasAny` → 400 (use `in`). Text operators match literally and
        case-insensitively.
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        eq: { $ref: '#/components/schemas/FilterText' }
        in: { $ref: '#/components/schemas/FilterTextList' }
        contains: { $ref: '#/components/schemas/FilterText' }
        startsWith: { $ref: '#/components/schemas/FilterText' }
        endsWith: { $ref: '#/components/schemas/FilterText' }

    TextListFieldFilter:
      description: >
        List-of-text field. Exactly one operator. `has` takes one value (a comma
        → 400, use `hasAny`); `in` → 400 (use `hasAny`).
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        has: { $ref: '#/components/schemas/FilterText' }
        hasAny: { $ref: '#/components/schemas/FilterTextList' }

    RangeFieldFilter:
      description: >
        Range field. `eq` is the available value; the plant matches when its
        range covers it. Decimal number.
      type: object
      additionalProperties: false
      required: [eq]
      properties:
        eq:
          type: string
          pattern: '^-?\d+(\.\d+)?$'

    BooleanFieldFilter:
      description: >
        Boolean flag. `eq` matches only the plants with that exact value; a
        plant without data for the flag never matches.
      type: object
      additionalProperties: false
      required: [eq]
      properties:
        eq:
          type: string
          enum: ['true', 'false']

    # ---------- Families ----------

    FamilyListFilter:
      type: object
      additionalProperties: false
      properties:
        id:
          type: object
          additionalProperties: false
          minProperties: 1
          maxProperties: 1
          properties:
            eq: { type: string, format: uuid }
            in: { $ref: '#/components/schemas/FilterTextList' }
        slug: { $ref: '#/components/schemas/TextFieldFilter' }
        name: { $ref: '#/components/schemas/TextFieldFilter' }
        scientificName: { $ref: '#/components/schemas/TextFieldFilter' }
        aliases: { $ref: '#/components/schemas/TextListFieldFilter' }
      example:
        name:
          startsWith: Aster

    FamilyListSort:
      type: object
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/SortDirection' }
        scientificName: { $ref: '#/components/schemas/SortDirection' }
        slug: { $ref: '#/components/schemas/SortDirection' }

    # ---------- Plants ----------

    PlantListFilter:
      description: >
        Every field accepts its type's full operator set.
      type: object
      additionalProperties: false
      properties:
        identity:
          description: >
            Matches name, aliases or scientific name (any of them).
          allOf:
            - $ref: '#/components/schemas/TextFieldFilter'
        family:
          description: Family id.
          type: object
          additionalProperties: false
          minProperties: 1
          maxProperties: 1
          properties:
            eq: { type: string, format: uuid }
            in: { $ref: '#/components/schemas/FilterTextList' }
        lightType: { $ref: '#/components/schemas/TextFieldFilter' }
        rootSystem: { $ref: '#/components/schemas/TextFieldFilter' }
        lifeCycle:
          description: Values annual, biennial, perennial. Exactly one operator.
          type: object
          additionalProperties: false
          minProperties: 1
          maxProperties: 1
          properties:
            eq:
              type: string
              enum: [annual, biennial, perennial]
            in: { $ref: '#/components/schemas/FilterTextList' }
        sowingMethod:
          description: Values direct, starter. Exactly one operator.
          type: object
          additionalProperties: false
          minProperties: 1
          maxProperties: 1
          properties:
            eq:
              type: string
              enum: [direct, starter]
            in: { $ref: '#/components/schemas/FilterTextList' }
        spacingCm: { $ref: '#/components/schemas/RangeFieldFilter' }
        soilPh: { $ref: '#/components/schemas/RangeFieldFilter' }
        soilAvailableDepthCm: { $ref: '#/components/schemas/RangeFieldFilter' }
        lightHoursMin: { $ref: '#/components/schemas/RangeFieldFilter' }
        sowingMonths:
          description: Months 1–12. Exactly one operator.
          type: object
          additionalProperties: false
          minProperties: 1
          maxProperties: 1
          properties:
            has:
              type: string
              pattern: '^(1[0-2]|[1-9])$'
            hasAny: { $ref: '#/components/schemas/FilterTextList' }
        edible: { $ref: '#/components/schemas/BooleanFieldFilter' }
        toxic: { $ref: '#/components/schemas/BooleanFieldFilter' }
      example:
        sowingMonths:
          hasAny: '3,4,5'

    PlantListSort:
      type: object
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/SortDirection' }
        scientificName: { $ref: '#/components/schemas/SortDirection' }

    # ---------- shared sort and pagination ----------

    SortDirection:
      type: string
      enum: [asc, desc]

    ListPagination:
      description: Defaults page 1, limit 25. Unknown keys → 400.
      type: object
      additionalProperties: false
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 25

    # ================= AUTH =================

    LoginUserRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RegisterUserRequest:
      type: object
      additionalProperties: false
      required: [id, email, username, password, repeatPassword]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: 8 to 64 characters and at most 72 bytes in UTF-8, including a lowercase letter, an uppercase letter, a digit and a non-alphanumeric character.
        repeatPassword:
          type: string
          minLength: 8
          maxLength: 64
          description: Must equal `password`.

    ActivateAccountRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          description: Opaque token from the activation link (43 base64url characters today).

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: The email address associated with the account.

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password, repeatPassword]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
          description: Opaque token from the reset link fragment (43 base64url characters).
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: New password meeting complexity rules.
        repeatPassword:
          type: string
          minLength: 8
          maxLength: 64
          description: Matching password confirmation.

    AuthenticateWithGoogleRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string

    AuthenticateWithGithubRequest:
      type: object
      additionalProperties: false
      required: [code, codeVerifier]
      properties:
        code:
          type: string
          description: The GitHub authorization code obtained through the authorization redirect.
        codeVerifier:
          type: string
          description: The PKCE code verifier the client generated for this authorization.

    UpdatePasswordRequest:
      type: object
      additionalProperties: false
      required: [password, repeatPassword, oldPassword]
      properties:
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: 8 to 64 characters and at most 72 bytes in UTF-8, including a lowercase letter, an uppercase letter, a digit and a non-alphanumeric character.
        repeatPassword:
          type: string
          minLength: 8
          maxLength: 64
          description: Must equal `password`.
        oldPassword:
          type: string

    # ================= RANGE =================

    Range:
      type: object
      required: [min, max]
      properties:
        min:
          type: number
        max:
          type: number

    # ================= FAMILY =================

    # Required texts are trimmed and never blank; text lists drop blank and
    # repeated entries. Limits mirror the request validation.

    FamilyTextList:
      description: >
        Entries are trimmed; blank entries and repeated entries (compared
        after trimming, ignoring letter case) are dropped, keeping the first
        occurrence. Non-string entries are rejected.
      type: array
      maxItems: 200
      items:
        type: string
        maxLength: 200

    FamilyHighlights:
      description: Same rule as FamilyTextList, with long-text entries.
      type: array
      maxItems: 200
      items:
        type: string
        maxLength: 2000

    FamilyExtra:
      description: >
        Optional taxonomy details. An empty object is never stored: it is
        returned and stored as absent.
      type: object
      additionalProperties: false
      properties:
        order:
          $ref: '#/components/schemas/RequiredShortText'
        distribution:
          $ref: '#/components/schemas/RequiredLongText'
        speciesCount:
          type: integer
          minimum: 1
        subfamilies:
          $ref: '#/components/schemas/FamilyTextList'

    UpdateFamilyExtra:
      description: >
        Merged key by key. `null` on a key removes that key; `{}` changes
        nothing; an extra left without keys is removed.
      type: object
      nullable: true
      additionalProperties: false
      properties:
        order:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
          pattern: '\S'
        distribution:
          type: string
          nullable: true
          minLength: 1
          maxLength: 2000
          pattern: '\S'
        speciesCount:
          type: integer
          nullable: true
          minimum: 1
        subfamilies:
          type: array
          nullable: true
          maxItems: 200
          items:
            type: string
            maxLength: 200

    Family:
      type: object
      required:
        [id, slug, name, scientificName, shortDescription, aliases, highlights]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
          readOnly: true
        slug:
          $ref: '#/components/schemas/RequiredShortText'
        name:
          $ref: '#/components/schemas/RequiredShortText'
        scientificName:
          $ref: '#/components/schemas/RequiredShortText'
        shortDescription:
          $ref: '#/components/schemas/RequiredLongText'
        aliases:
          $ref: '#/components/schemas/FamilyTextList'
        highlights:
          $ref: '#/components/schemas/FamilyHighlights'
        extra:
          $ref: '#/components/schemas/FamilyExtra'
        metadata:
          allOf:
            - $ref: '#/components/schemas/Metadata'
          readOnly: true

    FamilySummary:
      description: >
        Embedded family relation: only id, name and slug. Sent in place of the
        family id with `include=family`.
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/RequiredShortText'
        slug:
          $ref: '#/components/schemas/RequiredShortText'

    CreateFamily:
      type: object
      additionalProperties: false
      required: [id, slug, name, scientificName, shortDescription, highlights]
      properties:
        id:
          type: string
          format: uuid
        slug:
          $ref: '#/components/schemas/RequiredShortText'
        name:
          $ref: '#/components/schemas/RequiredShortText'
        scientificName:
          $ref: '#/components/schemas/RequiredShortText'
        shortDescription:
          $ref: '#/components/schemas/RequiredLongText'
        aliases:
          $ref: '#/components/schemas/FamilyTextList'
        highlights:
          $ref: '#/components/schemas/FamilyHighlights'
        extra:
          $ref: '#/components/schemas/FamilyExtra'

    UpdateFamily:
      description: >
        JSON Merge Patch. Every field optional; `{}` is a no-op. `id` and
        `version` are not accepted. Only `extra` and its keys accept `null`.
      type: object
      additionalProperties: false
      properties:
        slug:
          $ref: '#/components/schemas/RequiredShortText'
        name:
          $ref: '#/components/schemas/RequiredShortText'
        scientificName:
          $ref: '#/components/schemas/RequiredShortText'
        shortDescription:
          $ref: '#/components/schemas/RequiredLongText'
        aliases:
          $ref: '#/components/schemas/FamilyTextList'
        highlights:
          $ref: '#/components/schemas/FamilyHighlights'
        extra:
          $ref: '#/components/schemas/UpdateFamilyExtra'

    # ================= PLANT =================
    # Shared pieces are published once and reused by the response, create and
    # update schemas. Size limits mirror the request validation.

    FamilyFieldset:
      description: >
        A family read with `fields[families]`: `id` plus the requested fields,
        each with the same shape as in `Family`. Any field but `id` may be
        missing.
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
          readOnly: true
        slug:
          $ref: '#/components/schemas/RequiredShortText'
        name:
          $ref: '#/components/schemas/RequiredShortText'
        scientificName:
          $ref: '#/components/schemas/RequiredShortText'
        shortDescription:
          $ref: '#/components/schemas/RequiredLongText'
        aliases:
          $ref: '#/components/schemas/FamilyTextList'
        highlights:
          $ref: '#/components/schemas/FamilyHighlights'
        extra:
          $ref: '#/components/schemas/FamilyExtra'
        metadata:
          allOf:
            - $ref: '#/components/schemas/Metadata'
          readOnly: true

    Plant:
      type: object
      required: [id, identity, traits, phenology, image]
      properties:
        id:
          type: string

        version:
          type: integer
          minimum: 0
          readOnly: true

        identity:
          $ref: '#/components/schemas/PlantIdentityView'

        traits:
          $ref: '#/components/schemas/PlantTraits'

        phenology:
          $ref: '#/components/schemas/PlantPhenology'

        knowledge:
          $ref: '#/components/schemas/PlantKnowledge'

        image:
          $ref: '#/components/schemas/PlantImage'

        metadata:
          allOf:
            - $ref: '#/components/schemas/Metadata'
          readOnly: true

        status:
          allOf:
            - $ref: '#/components/schemas/PlantStatus'
          readOnly: true

        deletedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Set when the plant is deleted; `null` otherwise.

    PlantPhenology:
      type: object
      required: [sowing, flowering, harvest]
      properties:
        sowing:
          $ref: '#/components/schemas/PlantSowing'
        flowering:
          $ref: '#/components/schemas/PlantFlowering'
        harvest:
          $ref: '#/components/schemas/PlantHarvest'

    PlantFieldset:
      description: >
        A plant read with `fields[plants]`: `id` plus the requested fields,
        each with the same shape as in `Plant`. Any field but `id` may be
        missing.
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
        version:
          type: integer
          minimum: 0
          readOnly: true
        identity:
          $ref: '#/components/schemas/PlantIdentityView'
        traits:
          $ref: '#/components/schemas/PlantTraits'
        phenology:
          $ref: '#/components/schemas/PlantPhenology'
        knowledge:
          $ref: '#/components/schemas/PlantKnowledge'
        image:
          $ref: '#/components/schemas/PlantImage'
        metadata:
          allOf:
            - $ref: '#/components/schemas/Metadata'
          readOnly: true
        status:
          allOf:
            - $ref: '#/components/schemas/PlantStatus'
          readOnly: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    PlantStatus:
      type: string
      enum: [ACTIVE, DELETED]

    CreatePlant:
      type: object
      required: [id, identity, traits, phenology, knowledge]
      properties:
        id:
          type: string
          format: uuid
        identity:
          $ref: '#/components/schemas/PlantIdentity'
        traits:
          $ref: '#/components/schemas/PlantTraits'
        phenology:
          type: object
          description: >-
            Every plant is sown. `flowering` and `harvest` may be left out for
            plants that never flower or are not harvested.
          required: [sowing]
          properties:
            sowing:
              $ref: '#/components/schemas/PlantSowing'
            flowering:
              $ref: '#/components/schemas/PlantFlowering'
            harvest:
              $ref: '#/components/schemas/PlantHarvest'
        knowledge:
          description: >
            `resources` must include at least one entry of type `image`
            (every plant has a picture); otherwise → 400 at
            `knowledge.resources`.
          allOf:
            - $ref: '#/components/schemas/PlantKnowledge'
            - type: object
              required: [rootSystem, soil, light, propagation, resources]

    # Nullable fields declare their own `type` instead of reusing a shared
    # schema: OpenAPI 3.0.3 ignores `nullable` without `type` in the same
    # object, so `allOf` + `nullable` would not accept `null`.
    UpdatePlant:
      type: object
      description: >-
        Partial update. An absent field is kept; `null` removes an optional
        field (JSON Merge Patch, RFC 7396). Required fields reject `null`.
        Ranges may carry a single bound, merged into the stored one. An
        empty body `{}` changes nothing; `If-Match` is still checked.
        `knowledge.resources` must keep at least one entry of type `image`:
        `null` or a list without one → 400 at `knowledge.resources`.
      properties:
        identity:
          type: object
          properties:
            name:
              type: object
              properties:
                primary:
                  $ref: '#/components/schemas/RequiredShortText'
                aliases:
                  type: array
                  nullable: true
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/ShortText'
            scientificName:
              $ref: '#/components/schemas/RequiredShortText'
            family:
              $ref: '#/components/schemas/RequiredShortText'

        traits:
          type: object
          properties:
            lifecycle:
              $ref: '#/components/schemas/PlantLifecycle'
            size:
              type: object
              properties:
                height:
                  $ref: '#/components/schemas/PartialRange'
                spread:
                  $ref: '#/components/schemas/PartialRange'
            spacingCm:
              $ref: '#/components/schemas/PartialRange'
            ecological:
              type: object
              description: '`null` removes a key (back to "no data").'
              properties:
                edible:
                  type: boolean
                  nullable: true
                toxic:
                  type: boolean
                  nullable: true
                toxicityNotes:
                  type: string
                  nullable: true
                  minLength: 1
                  maxLength: 2000
                  pattern: '\S'

        phenology:
          type: object
          properties:
            sowing:
              type: object
              properties:
                months:
                  allOf:
                    - $ref: '#/components/schemas/Months'
                  minItems: 1
                seedsPerHole:
                  $ref: '#/components/schemas/PartialRange'
                germinationDays:
                  $ref: '#/components/schemas/PartialRange'
                methods:
                  type: object
                  properties:
                    direct:
                      type: object
                      properties:
                        depthCm:
                          $ref: '#/components/schemas/PartialRange'
                    starter:
                      type: object
                      nullable: true
                      properties:
                        depthCm:
                          $ref: '#/components/schemas/PartialRange'

            flowering:
              type: object
              properties:
                months:
                  $ref: '#/components/schemas/Months'
                pollination:
                  type: object
                  nullable: true
                  description: >-
                    Merged into the stored pollination: `types` replaces the
                    list, and a new pollination without `types` is rejected.
                    The agents are kept while an insect, bird or bat type
                    remains: `types` without any of them drops the stored
                    agents, and sending `agents` with it is rejected.
                    `pollination: null` removes the whole pollination;
                    `agents: null` removes only the agents.
                  properties:
                    types:
                      $ref: '#/components/schemas/PollinationTypes'
                    agents:
                      type: array
                      nullable: true
                      maxItems: 200
                      items:
                        $ref: '#/components/schemas/ShortText'

            harvest:
              type: object
              properties:
                months:
                  $ref: '#/components/schemas/Months'
                description:
                  type: string
                  nullable: true
                  description: Optional, but never blank when given.
                  minLength: 1
                  maxLength: 2000
                  pattern: '\S'

        knowledge:
          $ref: '#/components/schemas/UpdatePlantKnowledge'

    UpdatePlantKnowledge:
      type: object
      properties:
        soil:
          type: object
          properties:
            ph:
              $ref: '#/components/schemas/PartialRange'
            availableDepthCm:
              $ref: '#/components/schemas/PartialRange'
        rootSystem:
          type: object
          properties:
            type:
              $ref: '#/components/schemas/RequiredShortText'
            depthCm:
              $ref: '#/components/schemas/PartialRange'
            spreadCm:
              $ref: '#/components/schemas/PartialRange'
        watering:
          type: object
          nullable: true
          properties:
            frequency:
              $ref: '#/components/schemas/RequiredShortText'
            conditions:
              type: array
              nullable: true
              maxItems: 200
              items:
                type: string
                maxLength: 2000
        light:
          type: object
          properties:
            hoursMin:
              type: number
              minimum: 0
              maximum: 24
              description: Hours of light a day.
            type:
              $ref: '#/components/schemas/RequiredShortText'
            preference:
              type: string
              nullable: true
              maxLength: 200
        pruning:
          type: array
          nullable: true
          maxItems: 200
          items:
            $ref: '#/components/schemas/PruningEntry'
        propagation:
          type: object
          properties:
            methods:
              type: object
              description: >-
                Methods keyed by camelCase name; `null` removes that method.
              maxProperties: 20
              additionalProperties:
                type: object
                nullable: true
                properties:
                  seasons:
                    type: array
                    nullable: true
                    minItems: 1
                    maxItems: 4
                    uniqueItems: true
                    items:
                      $ref: '#/components/schemas/Season'
                  estimatedTimeWeeks:
                    type: object
                    nullable: true
                    properties:
                      min:
                        type: number
                      max:
                        type: number
                  bestPractices:
                    type: array
                    nullable: true
                    maxItems: 200
                    items:
                      type: string
                      maxLength: 2000
        ecology:
          type: object
          nullable: true
          properties:
            strategicBenefits:
              type: array
              nullable: true
              maxItems: 200
              items:
                type: string
                maxLength: 2000
        resources:
          type: array
          nullable: true
          maxItems: 200
          items:
            $ref: '#/components/schemas/PlantResource'
        notes:
          type: array
          nullable: true
          maxItems: 200
          items:
            type: string
            maxLength: 2000

    PlantIdentity:
      type: object
      required: [name, scientificName, family]
      properties:
        name:
          type: object
          required: [primary]
          properties:
            primary:
              $ref: '#/components/schemas/RequiredShortText'
            aliases:
              $ref: '#/components/schemas/ShortTextList'
        scientificName:
          $ref: '#/components/schemas/RequiredShortText'
        family:
          $ref: '#/components/schemas/RequiredShortText'

    PlantIdentityView:
      description: >
        Plant identity as returned by the API. `family` is the family id, or
        the family summary with `include=family`.
      type: object
      required: [name, scientificName, family]
      properties:
        name:
          type: object
          required: [primary]
          properties:
            primary:
              $ref: '#/components/schemas/RequiredShortText'
            aliases:
              $ref: '#/components/schemas/ShortTextList'
        scientificName:
          $ref: '#/components/schemas/RequiredShortText'
        family:
          description: >
            The family id; with `include=family`, the family summary (or the
            id when the family is not found).
          oneOf:
            - $ref: '#/components/schemas/RequiredShortText'
            - $ref: '#/components/schemas/FamilySummary'

    PlantLifecycle:
      type: string
      enum: [annual, biennial, perennial]

    PlantTraits:
      type: object
      required: [lifecycle, size, spacingCm]
      properties:
        lifecycle:
          $ref: '#/components/schemas/PlantLifecycle'
        size:
          type: object
          required: [height, spread]
          properties:
            height:
              $ref: '#/components/schemas/Range'
            spread:
              $ref: '#/components/schemas/Range'
        spacingCm:
          $ref: '#/components/schemas/Range'
        ecological:
          $ref: '#/components/schemas/PlantEcologicalTraits'

    PlantEcologicalTraits:
      type: object
      description: >-
        Safety facts about the plant. An absent key means there is no data,
        not `false`. Both may be `true`: an edible plant can have toxic
        parts. Catalog values come from Plants For A Future (pfaf.org).
      properties:
        edible:
          type: boolean
          description: Some part of the plant is edible.
        toxic:
          type: boolean
          description: Some part of the plant is known to be toxic or harmful.
        toxicityNotes:
          description: >-
            What the hazard is: toxic parts, doses, whether cooking reduces
            it. Catalog notes are written in Spanish. May come without
            `toxic` when the hazard is too vague to flag.
          allOf:
            - $ref: '#/components/schemas/RequiredLongText'

    PlantSowing:
      type: object
      required: [months, seedsPerHole, germinationDays, methods]
      properties:
        months:
          allOf:
            - $ref: '#/components/schemas/Months'
          minItems: 1
        seedsPerHole:
          $ref: '#/components/schemas/Range'
        germinationDays:
          $ref: '#/components/schemas/Range'
        methods:
          type: object
          required: [direct]
          properties:
            direct:
              $ref: '#/components/schemas/SowingMethod'
            starter:
              $ref: '#/components/schemas/SowingMethod'

    SowingMethod:
      type: object
      required: [depthCm]
      properties:
        depthCm:
          $ref: '#/components/schemas/Range'

    PlantFlowering:
      type: object
      description: No months for a plant that never flowers.
      required: [months]
      properties:
        months:
          $ref: '#/components/schemas/Months'
        pollination:
          type: object
          description: >-
            Types do not repeat. Agents need an insect, bird or bat type; an
            empty list is no agents. A plant that is not pollinated (spores,
            sterile…) has no pollination.
          required: [types]
          properties:
            types:
              $ref: '#/components/schemas/PollinationTypes'
            agents:
              $ref: '#/components/schemas/ShortTextList'

    PlantHarvest:
      type: object
      description: No months for a plant that is not harvested.
      required: [months]
      properties:
        months:
          $ref: '#/components/schemas/Months'
        description:
          $ref: '#/components/schemas/HarvestDescription'

    HarvestDescription:
      type: string
      description: Optional, but never blank when given.
      minLength: 1
      maxLength: 2000
      pattern: '\S'

    # ================= KNOWLEDGE =================

    PlantKnowledge:
      type: object
      nullable: true
      properties:
        soil:
          type: object
          required: [ph, availableDepthCm]
          properties:
            ph:
              $ref: '#/components/schemas/Range'
            availableDepthCm:
              $ref: '#/components/schemas/Range'

        rootSystem:
          type: object
          required: [type, depthCm, spreadCm]
          properties:
            type:
              $ref: '#/components/schemas/RequiredShortText'
            depthCm:
              $ref: '#/components/schemas/Range'
            spreadCm:
              $ref: '#/components/schemas/Range'

        watering:
          type: object
          required: [frequency]
          properties:
            frequency:
              $ref: '#/components/schemas/RequiredShortText'
            conditions:
              $ref: '#/components/schemas/LongTextList'

        light:
          type: object
          required: [hoursMin, type]
          properties:
            hoursMin:
              type: number
              minimum: 0
              maximum: 24
              description: Hours of light a day.
            type:
              $ref: '#/components/schemas/RequiredShortText'
            preference:
              $ref: '#/components/schemas/ShortText'

        pruning:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PruningEntry'

        propagation:
          $ref: '#/components/schemas/PlantPropagation'

        ecology:
          type: object
          properties:
            strategicBenefits:
              $ref: '#/components/schemas/LongTextList'

        resources:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PlantResource'

        notes:
          $ref: '#/components/schemas/LongTextList'

    PartialRange:
      type: object
      description: Either bound may be sent alone; it is merged by the domain.
      properties:
        min:
          type: number
        max:
          type: number

    Month:
      type: integer
      minimum: 1
      maximum: 12

    Months:
      type: array
      maxItems: 12
      items:
        $ref: '#/components/schemas/Month'

    PollinationType:
      type: string
      enum: [insect, wind, self, water, bird, bat]

    PollinationTypes:
      type: array
      minItems: 1
      maxItems: 6
      uniqueItems: true
      items:
        $ref: '#/components/schemas/PollinationType'

    Season:
      type: string
      enum: [spring, summer, autumn, winter]

    Seasons:
      type: array
      minItems: 1
      maxItems: 4
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Season'

    ShortText:
      type: string
      maxLength: 200

    RequiredShortText:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '\S'

    RequiredLongText:
      type: string
      minLength: 1
      maxLength: 2000
      pattern: '\S'

    ShortTextList:
      type: array
      maxItems: 200
      items:
        $ref: '#/components/schemas/ShortText'

    LongTextList:
      type: array
      maxItems: 200
      items:
        type: string
        maxLength: 2000

    PruningEntry:
      type: object
      required: [type, intensity, seasons, frequencyPerYear]
      properties:
        type:
          $ref: '#/components/schemas/RequiredShortText'
        intensity:
          $ref: '#/components/schemas/RequiredShortText'
        seasons:
          $ref: '#/components/schemas/Seasons'
        frequencyPerYear:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Prunings per year; 0.5 is once every two years.
        bestPractices:
          $ref: '#/components/schemas/LongTextList'

    PlantPropagation:
      type: object
      required: [methods]
      properties:
        methods:
          type: object
          description: Propagation methods keyed by camelCase method name.
          maxProperties: 20
          additionalProperties:
            type: object
            properties:
              seasons:
                $ref: '#/components/schemas/Seasons'
              estimatedTimeWeeks:
                $ref: '#/components/schemas/Range'
              bestPractices:
                $ref: '#/components/schemas/LongTextList'

    PlantResource:
      type: object
      required: [type, url]
      properties:
        type:
          $ref: '#/components/schemas/PlantResourceType'
        url:
          type: string
          format: uri
          description: Absolute `http` or `https` URL.
          pattern: '^https?://'
          maxLength: 2048
        title:
          $ref: '#/components/schemas/ShortText'
        source:
          $ref: '#/components/schemas/ShortText'
        tags:
          $ref: '#/components/schemas/ShortTextList'

    PlantResourceType:
      description: >
        Kind of resource; exact lowercase values (`Image` → 400). Every plant
        keeps at least one `image`.
      type: string
      enum: [image, article, video]

    PlantImage:
      description: >
        The plant's primary picture: the first `knowledge.resources` entry of
        type `image`, in stored order. Every plant has one. Read-only: derived
        from `knowledge.resources` and never written, so create and update
        reject an `image` key.
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Absolute `http` or `https` URL.
          pattern: '^https?://'
          maxLength: 2048
        title:
          $ref: '#/components/schemas/ShortText'
        source:
          $ref: '#/components/schemas/ShortText'

    # ================= BEDS =================

    Bed:
      type: object
      # `name` and `depth` are always returned: now required in the response.
      required:
        [
          id,
          userId,
          name,
          width,
          height,
          depth,
          plantInstances,
          metadata,
          deleted,
          version
        ]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        name:
          $ref: '#/components/schemas/RequiredShortText'
        width:
          $ref: '#/components/schemas/BedDimension'
        height:
          $ref: '#/components/schemas/BedDimension'
        depth:
          $ref: '#/components/schemas/BedDimension'
        plantInstances:
          description: >
            Flat array of active crop UUIDs by default; full PlantInstance objects
            when requested via `include=plantInstances`.
          type: array
          items:
            oneOf:
              - type: string
                format: uuid
              - $ref: '#/components/schemas/PlantInstanceResponse'
        metadata:
          $ref: '#/components/schemas/Metadata'
        deleted:
          type: boolean
        deletedAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer
          minimum: 0
          readOnly: true

    BedDimension:
      description: A positive finite JSON number (numeric strings are rejected).
      type: number
      exclusiveMinimum: 0

    CreateBed:
      type: object
      additionalProperties: false
      required: [id, name, width, height, depth]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/RequiredShortText'
        width:
          $ref: '#/components/schemas/BedDimension'
        height:
          $ref: '#/components/schemas/BedDimension'
        depth:
          $ref: '#/components/schemas/BedDimension'

    UpdateBed:
      description: >
        Partial update. Every field is optional and none can be cleared
        (`null` → 400). `{}` is a no-op: 200, version unchanged. Plants are
        never placed by patching the bed.
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/RequiredShortText'
        width:
          $ref: '#/components/schemas/BedDimension'
        height:
          $ref: '#/components/schemas/BedDimension'
        depth:
          $ref: '#/components/schemas/BedDimension'

    #  ================= PLANT INSTANCES =================

    PlacePlantInstance:
      type: object
      additionalProperties: false
      required: [id, bedId, plantId]
      properties:
        id:
          type: string
          format: uuid
        bedId:
          type: string
          format: uuid
        plantId:
          type: string
          format: uuid
        position:
          description: >
            Omit it for a crop without a spot in the bed yet; spatial checks
            (boundaries and neighbor spacing) only run when it is sent.
          allOf:
            - $ref: '#/components/schemas/Coordinates'
        growthStatus:
          allOf:
            - $ref: '#/components/schemas/CropGrowthStatus'
          default: planted
        plantedAt:
          type: string
          format: date-time
        variety:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: string
          maxLength: 1000

    UpdatePlantInstance:
      type: object
      additionalProperties: false
      properties:
        position:
          $ref: '#/components/schemas/Coordinates'
        growthStatus:
          $ref: '#/components/schemas/CropGrowthStatus'
        variety:
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
        notes:
          type: string
          nullable: true
          maxLength: 1000

    Coordinates:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x:
          type: number
          minimum: 0
        y:
          type: number
          minimum: 0

    CropGrowthStatus:
      type: string
      enum: [seeded, planted, growing, harvested]

    PlantInstanceLifecycleStatus:
      type: string
      enum: [active, removed]

    PlantInstanceResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - bedId
        - plantId
        - growthStatus
        - instanceStatus
        - plantedAt
        - metadata
        - version
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        bedId:
          type: string
          format: uuid
        plantId:
          type: string
          format: uuid
        position:
          $ref: '#/components/schemas/Coordinates'
        growthStatus:
          $ref: '#/components/schemas/CropGrowthStatus'
        instanceStatus:
          $ref: '#/components/schemas/PlantInstanceLifecycleStatus'
        plantedAt:
          type: string
          format: date-time
        removedAt:
          type: string
          format: date-time
        variety:
          type: string
        notes:
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
        version:
          type: integer
          minimum: 0

    PaginatedPlantInstances:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlantInstanceResponse'
        pagination:
          $ref: '#/components/schemas/PaginationResponse'

  responses:
    UnprocessableEntityError:
      description: >
        The request is well-formed but cannot be processed: the `add` and
        `remove` role sets overlap. Checked before any domain logic.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: string

    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string

    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string

    ConflictError:
      description: >-
        Conflict with a business rule (e.g. duplicate resource, bed that still
        has plants). Outdated versions are reported as 412, not 409.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
              errors:
                type: object
                description: >-
                  One message per invalid field. Keys are dot-notation paths
                  inside the request part, without a part prefix (`id`,
                  `identity.name.primary`, `tags.1`); a wrong part root uses
                  `params`, `query` or `body`. When a field has several
                  problems, the first one wins. Unknown fields get the message
                  "Unknown field"; a failed pattern check whose message would
                  reveal the pattern gets "Invalid format". At most 20 field
                  entries are returned; if there are more, an extra
                  `_truncated` entry is added. Keys longer than 64 characters
                  are cut to 64 ending in `…`; two keys equal after cutting
                  share one entry. Messages never contain submitted values.
                additionalProperties:
                  type: string

    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string

    PreconditionFailedError:
      description: The stated version is not the current one. Reload with GET and retry.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string

    PreconditionRequiredError:
      description: The `If-Match` header is required (missing or `*`).
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string

    InternalServerError:
      description: >-
        Unexpected server failure, or stored data that breaks this contract:
        the body is never sent then (fail closed) and the failure is logged.
        The message is always generic.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
                example: Internal server error

    ServiceUnavailableError:
      description: >-
        A provider the request depends on could not be reached, errored, or
        rate-limited the API (for GitHub sign-in: the code exchange or the email
        read failed this way; for Google: its public keys could not be fetched).
        Nothing was stored. The message is generic and the failure is logged;
        the client may retry later.
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
                example: GitHub sign-in is temporarily unavailable

    NotModified:
      description: >-
        The request's `If-None-Match` matches the current `ETag`; no body.
        Framework behavior accepted by the contract (no caching semantics).
